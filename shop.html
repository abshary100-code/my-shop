/* =========================

========================= */

async function saveProducts(){

  localStorage.setItem("myProducts",JSON.stringify(products));

  try{

    const batch=db.batch();

    products.forEach(p=>{

      const ref=db
        .collection("products")
        .doc(String(p.id));

      batch.set(ref,p);

    });

    await batch.commit();

    console.log("Products saved to Firebase");

    return true;

  }catch(error){

    console.error("Firebase save error:",error);

    alert(
      "محصول در سایت ذخیره شد، اما ذخیره در Firebase انجام نشد.\n\n"+
      "اگر خطای Permission دیدی، قوانین Firestore را باید تنظیم کنیم."
    );

    return false;
  }
}

async function loadProducts(){

  try{

    const snapshot=await db
      .collection("products")
      .get();

    if(!snapshot.empty){

      products=snapshot.docs.map(doc=>doc.data());

      localStorage.setItem(
        "myProducts",
        JSON.stringify(products)
      );

      console.log("Products loaded from Firebase");

    }else{

      console.log("Firebase products collection is empty.");

      await saveProducts();

    }

    renderProducts();

  }catch(error){

    console.error("Firebase load error:",error);

    renderProducts();
  }
}

/* =========================
   CART
========================= */

function addToCart(id){

  const p=products.find(x=>x.id===id);

  if(!p || p.stock<=0){

    alert("این محصول موجود نیست.");

    return;
  }

  const item=cart.find(x=>x.id===id);

  if(item){

    if(item.qty>=p.stock){

      alert("بیشتر از موجودی نمی‌توانی اضافه کنی.");

      return;
    }

    item.qty++;

  }else{

    cart.push({
      id:id,
      qty:1
    });

  }

  showCart();
}

function showCart(){

  document.getElementById("cart").classList.remove("hidden");
  document.getElementById("favorites").classList.add("hidden");
  document.getElementById("profile").classList.add("hidden");

  document
    .getElementById("cart")
    .scrollIntoView({behavior:"smooth"});

  renderCart();
}

function renderCart(){

  const box=document.getElementById("cartItems");

  box.innerHTML="";

  if(cart.length===0){

    box.innerHTML="<p>سبد خرید خالی است.</p>";

    updateTotals();

    return;
  }

  cart.forEach(item=>{

    const p=products.find(x=>x.id===item.id);

    if(!p)return;

    box.innerHTML+=`

      <div class="cart-item">

        <div>

          <strong>${p.name}</strong>

          <div>
            ${formatPrice(p.price)} تومان
          </div>

        </div>

        <div class="qty">

          <button onclick="decrease(${p.id})">
            −
          </button>

          <span>${item.qty}</span>

          <button onclick="increase(${p.id})">
            +
          </button>

          <button onclick="removeItem(${p.id})">
            🗑️
          </button>

        </div>

      </div>

    `;

  });

  updateTotals();
}

function increase(id){

  const item=cart.find(x=>x.id===id);
  const p=products.find(x=>x.id===id);

  if(item && item.qty<p.stock){
    item.qty++;
  }

  renderCart();
}

function decrease(id){

  const item=cart.find(x=>x.id===id);

  if(!item)return;

  item.qty--;

  if(item.qty<=0){
    cart=cart.filter(x=>x.id!==id);
  }

  renderCart();
}

function removeItem(id){

  cart=cart.filter(x=>x.id!==id);

  renderCart();
}

function calculateSubtotal(){

  return cart.reduce((sum,item)=>{

    const p=products.find(x=>x.id===item.id);

    return sum+(p ? p.price*item.qty : 0);

  },0);
}

function updateTotals(){

  const subtotal=calculateSubtotal();

  const discount=
    Math.floor(subtotal*discountPercent/100);

  const total=
    subtotal-discount+shippingCost;

  document.getElementById("subtotal")
    .textContent=formatPrice(subtotal);

  document.getElementById("discount")
    .textContent=formatPrice(discount);

  document.getElementById("shipping")
    .textContent=formatPrice(shippingCost);

  document.getElementById("total")
    .textContent=formatPrice(total);
}

function applyDiscount(){

  const code=
    document.getElementById("discountCode")
    .value.trim()
    .toUpperCase();

  const message=
    document.getElementById("discountMessage");

  if(code==="GIFT10"){

    discountPercent=10;

    message.textContent=
      "🎉 کد تخفیف ۱۰٪ اعمال شد.";

  }else{

    discountPercent=0;

    message.textContent=
      "❌ کد تخفیف نامعتبر است.";
  }

  updateTotals();
}

function updateShipping(){

  const method=
    document.getElementById("shippingMethod").value;

  if(method==="normal"){
    shippingCost=30000;
  }

  if(method==="fast"){
    shippingCost=60000;
  }

  if(method==="pickup"){
    shippingCost=0;
  }

  updateTotals();
}

  if(cart.length===0){

async function submitOrder(){

  const name=
    document.getElementById("customerName")
    .value.trim();

  const phone=
    document.getElementById("customerPhone")
    .value.trim();

  const address=
    document.getElementById("customerAddress")
    .value.trim();

  if(!name || !phone || !address){

    alert("لطفاً اطلاعات سفارش را کامل کن.");

    return;
  }

  const subtotal=calculateSubtotal();

  const discount=
    Math.floor(subtotal*discountPercent/100);

  const total=
    subtotal-discount+shippingCost;

  const order={

    id:Date.now(),

    date:new Date().toLocaleString("fa-IR"),

    customer:{
      name:name,
      phone:phone,
      address:address
    },

    items:cart.map(item=>{

      const p=products.find(x=>x.id===item.id);

      return {
        id:item.id,
        name:p.name,
        price:p.price,
        qty:item.qty
      };

    }),

    shipping:shippingCost,
    discount:discount,
    total:total,
    status:"جدید"
  };

  orders.push(order);

  saveOrders();

  cart.forEach(item=>{

    const p=products.find(x=>x.id===item.id);

    if(p){
      p.stock=Math.max(
        0,
        p.stock-item.qty
      );
    }

  });

  await saveProducts();

  cart=[];
  discountPercent=0;
  shippingCost=30000;

  document.getElementById("customerName").value="";
  document.getElementById("customerPhone").value="";
  document.getElementById("customerAddress").value="";
  document.getElementById("discountCode").value="";
  document.getElementById("discountMessage").textContent="";

  closeCheckout();

  renderProducts();
  renderCart();

  alert("🎉 سفارش با موفقیت ثبت شد!");
}

function getStars(rating){

  const rounded=Math.round(rating);

  return "★".repeat(rounded)+
         "☆".repeat(5-rounded);
}

function getAverageRating(id){

  const list=
    reviews.filter(r=>r.productId===id);

  if(list.length===0)return 5;

  return list.reduce(
    (a,b)=>a+b.rating,
    0
  )/list.length;
}

function renderReviews(id){

  const list=
    reviews.filter(r=>r.productId===id);

  if(list.length===0){

    return "<p style='margin-top:10px'>هنوز نظری ثبت نشده.</p>";

  }

  return list.map(r=>`

    <div class="review">

      <strong>${r.name}</strong>

      <div class="stars">
        ${getStars(r.rating)}
      </div>

      <p>${r.text}</p>

    </div>

  `).join("");
}

function submitReview(id){

  const rating=
    Number(
      document.getElementById("reviewRating").value
    );

  const text=
    document.getElementById("reviewText")
    .value.trim();

  if(!text){

    alert("لطفاً نظر خودت را بنویس.");

    return;
  }

  reviews.push({

    productId:id,

    name:
      currentUser
      ? currentUser.name
      : "کاربر",

    rating:rating,

    text:text
  });

  saveReviews();

  showProduct(id);

  renderProducts();
}

async function addProduct(){

  const name=
    document.getElementById("newName")
    .value.trim();

  const price=
    Number(
      document.getElementById("newPrice").value
    );

  const stock=
    Number(
      document.getElementById("newStock").value
    );

  const image=
    document.getElementById("newImage")
    .value.trim();

  const description=
    document.getElementById("newDescription")
    .value.trim();

  const category=
    document.getElementById("newCategory").value;

  if(!name || !price || stock<0 || !image){

    alert("اطلاعات محصول را کامل کن.");

    return;
  }

  products.push({

    id:Date.now(),

    name:name,

    price:price,

    stock:stock,

    image:image,

    description:description,

    category:category

  });

  const saved=await saveProducts();

  if(saved){

    alert("✅ محصول در Firebase ذخیره شد.");

  }else{

    alert(
      "⚠️ محصول در مرورگر ذخیره شد، اما Firebase خطا داد."
    );
  }

  renderAdmin();
  renderProducts();
}

function renderAdminProducts(){

  const box=
    document.getElementById("adminProducts");

  box.innerHTML=
    products.map(p=>`

      <div class="admin-product">

        <div>

          <strong>${p.name}</strong>

          <div>
            ${formatPrice(p.price)} تومان
          </div>

          <small>
            موجودی: ${p.stock}
          </small>

        </div>

        <div>

          <button
            class="secondary"
            onclick="editProduct(${p.id})">

            ویرایش

          </button>

          <button
            class="secondary"
            onclick="deleteProduct(${p.id})">

            حذف

          </button>

        </div>

      </div>

    `).join("");
}

async function editProduct(id){

  const p=
    products.find(x=>x.id===id);

  if(!p)return;

  const name=
    prompt("نام محصول:",p.name);

  if(name===null)return;

  const price=
    prompt("قیمت:",p.price);

  if(price===null)return;

  const stock=
    prompt("موجودی:",p.stock);

  if(stock===null)return;

  p.name=name.trim();
  p.price=Number(price);
  p.stock=Number(stock);

  await saveProducts();

  renderAdmin();
  renderProducts();
}

async function deleteProduct(id){

  if(!confirm("این محصول حذف شود؟")){
    return;
  }

  products=
    products.filter(p=>p.id!==id);

  try{

    await db
      .collection("products")
      .doc(String(id))
      .delete();

  }catch(error){

    console.error(
      "Firebase delete error:",
      error
    );
  }

  localStorage.setItem(
    "myProducts",
    JSON.stringify(products)
  );

  renderAdmin();
  renderProducts();
}

function renderOrders(){

  const box=
    document.getElementById("adminOrders");

  if(orders.length===0){

    box.innerHTML=
      "<p>هنوز سفارشی ثبت نشده.</p>";

    return;
  }

  box.innerHTML=
    orders
      .slice()
      .reverse()
      .map(o=>`

        <div class="panel">

          <strong>
            سفارش #${o.id}
          </strong>

          <p>
            تاریخ: ${o.date}
          </p>

          <p>
            مشتری: ${o.customer.name}
          </p>

          <p>
            شماره: ${o.customer.phone}
          </p>

          <p>
            مبلغ:
            ${formatPrice(o.total)}
            تومان
          </p>

          <select
            onchange="changeOrderStatus(${o.id},this.value)">

            <option
              ${o.status==="جدید"?"selected":""}>
              جدید
            </option>

            <option
              ${o.status==="در حال آماده‌سازی"?"selected":""}>
              در حال آماده‌سازی
            </option>

            <option
              ${o.status==="ارسال‌شده"?"selected":""}>
              ارسال‌شده
            </option>

            <option
              ${o.status==="تکمیل‌شده"?"selected":""}>
              تکمیل‌شده
            </option>

          </select>

          <button
            class="secondary"
            onclick="deleteOrder(${o.id})">

            حذف سفارش

          </button>

        </div>

      `)
      .join("");
}

function changeOrderStatus(id,status){

  const order=
    orders.find(o=>o.id===id);

  if(order){

    order.status=status;

    saveOrders();

    renderOrders();
  }
}

function deleteOrder(id){

  if(!confirm("این سفارش حذف شود?")){
    return;
  }

  orders=
    orders.filter(o=>o.id!==id);

  saveOrders();

  renderAdmin();
}

function showFirebaseStatus(){

  const status=document.createElement("div");

  status.id="firebaseStatus";

  status.textContent="🟢 متصل به Firebase ✓";

  status.style.position="fixed";
  status.style.bottom="15px";
  status.style.left="15px";
  status.style.zIndex="9999";
  status.style.padding="9px 13px";
  status.style.borderRadius="12px";
  status.style.background="#111";
  status.style.color="#fff";
  status.style.fontSize="12px";
  status.style.boxShadow="0 5px 20px rgba(0,0,0,.2)";

  document.body.appendChild(status);
}
