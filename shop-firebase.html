<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>فروشگاه من</title>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>

<style>
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#fff;
  color:#222;
}
header{
  background:#000;
  color:#fff;
  padding:18px;
  text-align:center;
}
h1{margin:0}
#status{
  padding:12px;
  text-align:center;
  background:#f5f5f5;
}
.search{
  display:block;
  width:90%;
  max-width:500px;
  margin:20px auto;
  padding:12px;
  border:1px solid #ddd;
  border-radius:10px;
  font-size:16px;
}
#products{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:20px;
  padding:20px;
}
.product{
  border:1px solid #eee;
  border-radius:15px;
  padding:15px;
  text-align:center;
  box-shadow:0 2px 8px #ddd;
}
.product img{
  width:100%;
  height:180px;
  object-fit:cover;
  border-radius:10px;
}
button{
  background:#ff69b4;
  border:0;
  padding:10px 18px;
  border-radius:10px;
  cursor:pointer;
  margin-top:10px;
}
</style>
</head>

<body>

<header>
  <h1>🛍️ فروشگاه من</h1>
</header>

<div id="status">در حال اتصال به Firebase...</div>

<input
  id="search"
  class="search"
  placeholder="جستجوی محصول..."
>

<div id="products"></div>

<script>

const firebaseConfig = {
  apiKey: "AIzaSyCUMWC1yK997jae6vYTXUTXDIltjQSFTCw",
  authDomain: "my-shop-732a9.firebaseapp.com",
  projectId: "my-shop-732a9",
  storageBucket: "my-shop-732a9.firebasestorage.app",
  messagingSenderId: "1055009747938",
  appId: "1:1055009747938:web:8586dd7a1167c741b23fbb"
};

firebase.initializeApp(firebaseConfig);

const db = firebase.firestore();

let products = [];

const defaultProducts = [
  {
    id:"bag",
    name:"کیف صورتی",
    price:25,
    image:"https://images.unsplash.com/photo-1584917865442-de89df76afd3?w=500"
  },
  {
    id:"hoodie",
    name:"هودی مشکی",
    price:35,
    image:"https://images.unsplash.com/photo-1556821840-3a63f95609a7?w=500"
  },
  {
    id:"bracelet",
    name:"دستبند صورتی",
    price:10,
    image:"https://images.unsplash.com/photo-1611591437281-460bfbe1220a?w=500"
  },
  {
    id:"shirt",
    name:"تی‌شرت سفید",
    price:20,
    image:"https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?w=500"
  }
];

async function loadProducts(){

  try{

    const snapshot = await db.collection("products").get();

    if(snapshot.empty){

      for(const product of defaultProducts){
        await db.collection("products")
          .doc(product.id)
          .set(product);
      }

      products = defaultProducts;

    }else{

      products = snapshot.docs.map(doc => ({
        id:doc.id,
        ...doc.data()
      }));

    }

    document.getElementById("status").innerHTML =
      "🟢 متصل به Firebase ✓";

    displayProducts(products);

  }catch(error){

    console.error(error);

    document.getElementById("status").innerHTML =
      "🔴 خطا در اتصال به Firebase";

    products = defaultProducts;

    displayProducts(products);
  }
}

function displayProducts(list){

  const container = document.getElementById("products");

  container.innerHTML = "";

  list.forEach(product => {

    container.innerHTML += `
      <div class="product">

        <img src="${product.image}" alt="${product.name}">

        <h2>${product.name}</h2>

        <p>${product.price} دلار</p>

        <button onclick="saveOrder('${product.id}')">
          خرید
        </button>

      </div>
    `;

  });
}

document.getElementById("search").addEventListener("input",function(){

  const text = this.value.toLowerCase();

  const filtered = products.filter(product =>
    product.name.toLowerCase().includes(text)
  );

  displayProducts(filtered);

});

async function saveOrder(productId){

  const product = products.find(p => p.id === productId);

  if(!product) return;

  try{

    await db.collection("orders").add({

      productId:product.id,

      productName:product.name,

      price:product.price,

      createdAt:firebase.firestore.FieldValue.serverTimestamp()

    });

    alert("سفارش با موفقیت ثبت شد ❤️");

  }catch(error){

    console.error(error);

    alert("ثبت سفارش انجام نشد");

  }
}

loadProducts();

</script>

</body>
</html>
